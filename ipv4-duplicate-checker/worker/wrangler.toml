name = "ipv4-duplicate-checker-api"
main = "src/index.js"
compatibility_date = "2026-11-09"

# After creating your NEW D1 database, replace the placeholder below
# with the database_id shown by Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "ipv4-duplicate-checker-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Set this to your exact Vercel website origin after deployment, e.g.
# ALLOWED_ORIGIN = "https://your-project.vercel.app"
# During initial setup, "*" is used if this variable is not set.
ALLOWED_ORIGIN = "*"
